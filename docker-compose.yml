services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      - BOT_INTERNAL_API_URL=http://bot:8001
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      bot:
        condition: service_healthy
    networks:
      - app-network

  bot:
    build:
      context: ./bot
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./bot:/app
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
